domain_security_considerations:
  sensitive_areas:
    - area: Approval bypass risk
      location: backend/core/task_engine.py:368 and backend/core/confirmation_manager.py:111
      concern: High-security tasks trigger confirmation in memory, but there is no persisted approval ledger in the current module.
    - area: Evidence durability
      location: backend/core/verification_system.py:456 and backend/core/verification_system.py:510
      concern: Audit logs and proofs are stored in process memory, so evidence is not durable across restarts.
    - area: Tenant and role enforcement
      location: backend/core/auth.py:19 and backend/routes/tasks_v2.py:146
      concern: Access control is principal-based, but some routes still rely on tenant-scoped data conventions rather than explicit role gates.
    - area: Security headers and rate limiting
      location: backend/core/security.py:1 and backend/main.py:337
      concern: Security middleware exists, but it is separate from mission-specific authorization and approval policies.
    - area: Task and dashboard polling
      location: frontend/src/components/TaskPanel.jsx:24
      concern: Polling depends on route and storage consistency; schema mismatches can surface as empty dashboards.
  authentication_patterns_in_domain: Bearer JWT in non-dev environments; dev and test fallback headers are supported by get_current_principal.
  authorization_patterns_in_domain: Role gate helper exists as require_role, while task routes enforce owner checks with principal.user_id.
  data_validation_in_domain: Pydantic model validation in routes plus sanitizer and SQL injection checks in core validation modules.
testing_patterns:
  framework: pytest
  coverage_areas: [route validation, health and metrics, security headers and rate limiting, task engine contracts, confirmation workflow, proof generation, monitoring primitives]
  test_organization: Backend tests split between backend/tests for API and core behavior and tests for behavioral, integration, and e2e checks.
  mock_patterns: [FastAPI TestClient, unittest.mock.patch, MagicMock and AsyncMock fixtures, in-memory behavior assertions]
open_questions:
  - question: Should mission approvals be persisted in the existing tasks schema or in a new approval ledger?
    context: Current approval state is in memory in ConfirmationManager, while task persistence is generic and does not store approval history.
    type: decision_blocker
    affects: [backend/core/confirmation_manager.py, backend/database_supabase.py, backend/routes/tasks_v2.py]
  - question: Should evidence artifacts live in Supabase tables, object storage, or both?
    context: Proof and audit services currently return serialized proof data and keep audit logs in memory.
    type: decision_blocker
    affects: [backend/core/verification_system.py, backend/database_supabase.py, frontend/src/AppClean.jsx]
  - question: Which frontend surface should become the canonical governed mission dashboard?
    context: The workspace is split across App.jsx, AppClean.jsx, TaskPanel.jsx, and TaskAdaptiveWorkspace.jsx.
    type: research
    affects: [frontend/src/App.jsx, frontend/src/AppClean.jsx, frontend/src/TaskAdaptiveWorkspace.jsx, frontend/src/components/TaskPanel.jsx]
  - question: Should the mission state model reuse TaskStatus or introduce a separate mission lifecycle enum?
    context: There are at least two status vocabularies already: TaskStatus in task_engine.py and TaskStatus in agent/orchestrator.py.
    type: decision_blocker
    affects: [backend/core/task_engine.py, backend/agent/orchestrator.py, backend/routes/tasks_v2.py]
  - question: How should compliance exports map to current proof and audit payloads?
    context: Current proof and audit structures are serializable but not yet tied to an export pipeline.
    type: nice_to_know
    affects: [backend/core/verification_system.py, backend/routes/api.py, frontend/src/AppClean.jsx]
gaps:
  - area: Persistent approvals
    description: No durable approval table or persisted approval reason capture was found; ConfirmationManager stores pending actions only in memory.
    impact: decision_blocker
    affects: [backend/core/confirmation_manager.py, backend/database_supabase.py]
  - area: Persistent audit and evidence
    description: Audit history and proof generation are in memory or returned as response payloads; there is no dedicated audit or evidence table in MIGRATION_SQL.
    impact: decision_blocker
    affects: [backend/core/verification_system.py, backend/database_supabase.py]
  - area: Mission model
    description: The current storage schema has generic tasks, workflow_sessions, and plugin_executions, but no dedicated governed mission table with lifecycle, policy, and trust metrics.
    impact: research_blocker
    affects: [backend/database_supabase.py, backend/routes/tasks_v2.py, backend/core/task_engine.py]
  - area: Notifications storage
    description: The task notifications route exists in backend/routes/tasks_v2.py, but the Supabase migration shown in backend/database_supabase.py does not define a notifications table.
    impact: research_blocker
    affects: [backend/routes/tasks_v2.py, backend/database_supabase.py, frontend/src/components/TaskPanel.jsx]
  - area: Frontend trust dashboard
    description: The frontend shows proof badges, task cards, and a trust footer, but no dedicated trust metrics dashboard or immutable audit viewer was identified in frontend/src.
    impact: research_blocker
    affects: [frontend/src/AppClean.jsx, frontend/src/components/TaskPanel.jsx, frontend/src/TaskAdaptiveWorkspace.jsx]
  - area: Role-gated admin surfaces
    description: Role-based authorization helpers exist, but no route-level admin, approver, or auditor screens were identified in the current frontend or backend route set.
    impact: nice_to_know
    affects: [backend/core/auth.py, frontend/src/App.jsx, frontend/src/AppClean.jsx]
