related_architecture:
  components_relevant_to_domain:
    - component: chat API layer
      responsibility: Turns user requests into governed responses with status, proof, and UI fields.
      location: backend/routes/api.py:675
      relationship_to_domain: Primary entrypoint for governed missions and approval prompts.
    - component: task orchestration routes
      responsibility: Creates tasks, updates substeps, handles user input, cancellation, and notifications.
      location: backend/routes/tasks_v2.py:61
      relationship_to_domain: Direct fit for mission state machine and approval queue screens.
    - component: task engine
      responsibility: Parses intent, classifies security, blocks high-risk execution pending confirmation, tracks task status.
      location: backend/core/task_engine.py:307
      relationship_to_domain: Core reuse point for mission states and risk-gated execution.
    - component: confirmation manager
      responsibility: Builds pending actions and tracks approved or rejected status per session.
      location: backend/core/confirmation_manager.py:26
      relationship_to_domain: Current approval-engine primitive.
    - component: verification system
      responsibility: Creates proof-of-execution and audit events.
      location: backend/core/verification_system.py:81
      relationship_to_domain: Evidence and audit primitive for governed missions.
    - component: observability stack
      responsibility: Metrics, health, request tracing, and circuit breakers.
      location: backend/core/monitoring.py:214
      relationship_to_domain: Telemetry backbone for trust metrics and operational dashboards.
    - component: task dashboard panel
      responsibility: Polls tasks and notifications, shows progress bars, substeps, and iteration UI.
      location: frontend/src/components/TaskPanel.jsx:24
      relationship_to_domain: Ready-made dashboard fragment for mission timelines.
    - component: adaptive workspace
      responsibility: Dynamically assembles task-specific workspace panels from the active user request.
      location: frontend/src/TaskAdaptiveWorkspace.jsx:1243
      relationship_to_domain: Existing task-centric shell for mission detail and workflow views.
  interfaces_used_by_domain:
    - interface: ChatResponse
      location: backend/routes/api.py:566
      usage_pattern: Carries task state, proof, steps, and UI components to the frontend.
    - interface: TaskResponse
      location: backend/routes/tasks_v2.py:31
      usage_pattern: Returns task progress, substeps, and ETA to TaskPanel.
    - interface: ProofOfExecution
      location: backend/core/verification_system.py:57
      usage_pattern: Serializable evidence payload for UI and export.
    - interface: Principal
      location: backend/core/auth.py:19
      usage_pattern: Tenant, user, and role context for access control.
  data_flow_involving_domain: User request enters /api/chat or /api/v2/tasks, is classified into task and security state, may pause for confirmation, executes substeps, emits proof and audit events, and is rendered in TaskPanel, AppClean, and TaskAdaptiveWorkspace with polling and proof badges.
  key_relationships_to_domain:
    - from: backend/routes/api.py:chat_endpoint
      to: backend/core/task_engine.py:process_request
      relationship: calls
    - from: backend/routes/tasks_v2.py:create_task
      to: backend/agent/orchestrator.py:create_task
      relationship: calls
    - from: backend/routes/tasks_v2.py:update_substep
      to: backend/agent/orchestrator.py:complete_substep
      relationship: calls
    - from: backend/routes/tasks_v2.py:get_notifications
      to: backend/database_supabase.py notifications storage path
      relationship: calls
    - from: frontend/src/components/TaskPanel.jsx
      to: backend/routes/tasks_v2.py:get_user_tasks
      relationship: calls
    - from: frontend/src/AppClean.jsx
      to: backend/routes/api.py:chat_endpoint
      relationship: calls
    - from: backend/main.py
      to: backend/core/security.py, backend/core/performance.py, backend/core/monitoring.py, backend/core/logging_config.py
      relationship: imports
related_technology_stack:
