patterns_found:
  - category: naming
    pattern: Task, status, progress, proof, and approval vocabulary is reused across backend and frontend.
    description: The same state vocabulary appears in task_engine, tasks_v2, TaskPanel, TaskAdaptiveWorkspace, App.jsx, and AppClean.jsx.
    examples:
      - file: backend/core/task_engine.py
        location: backend/core/task_engine.py:36
        snippet: TaskStatus values include pending, awaiting_input, awaiting_confirmation, awaiting_verification, processing, executing, completed, failed, cancelled.
      - file: frontend/src/components/TaskPanel.jsx
        location: frontend/src/components/TaskPanel.jsx:24
        snippet: Task cards render status, progress_percent, substeps, and notifications.
    prevalence: common
  - category: architecture
    pattern: Governed execution is already split into intent parsing, security classification, confirmation gating, execution, proof generation, and dashboard rendering.
    description: The codebase already exposes each stage as a separate module or route surface.
    examples:
      - file: backend/core/task_engine.py
        location: backend/core/task_engine.py:325
        snippet: process_request -> input request -> confirmation request -> execute task.
      - file: backend/core/verification_system.py
        location: backend/core/verification_system.py:525
        snippet: VerificationService.verify_task_completion generates proof and logs proof_generated events.
    prevalence: common
  - category: error_handling
    pattern: Routes raise HTTPException while core services generally log and return dictionaries or booleans.
    description: User-facing failures are usually HTTP errors; lower-level components are in-memory helpers with simple return contracts.
    examples:
      - file: backend/routes/tasks_v2.py
        location: backend/routes/tasks_v2.py:145
        snippet: Task not found and Forbidden are returned as HTTPException.
      - file: backend/core/confirmation_manager.py
