related_conventions:
  naming_patterns_in_domain: Task, status, progress, proof, confirmation, notification, health, and metrics vocabulary is reused across backend and frontend.
  structure_of_domain: Backend separates request handling in backend/routes, execution and orchestration in backend/core and backend/agent, data access in backend/database_supabase.py, and telemetry/security in backend/main.py, backend/core/security.py, and backend/core/monitoring.py. Frontend separates the chat shell, task dashboard, and adaptive workspace.
  error_handling_in_domain: Route code generally raises HTTPException on user-facing failures; core services often log and return dictionaries or False. In-memory fallbacks are common when Supabase is unavailable.
  testing_in_domain: Behavioral tests focus on enum and dataclass contracts and real workflow behavior. API tests cover health, chat validation, rate limiting, CORS, input validation, and basic concurrency.
  documentation_in_domain: Docstrings and module headers describe the intended workflow model, but some storage and route contracts are broader than the current schema.
