    description: |
      Refactor backend/core/brain.py, backend/database_supabase.py, and backend/agent/orchestrator.py so service access is principal-scoped instead of falling back to default user ids.
      This removes the last shared-service paths that can bypass tenant isolation even after the route layer is fixed.
      It directly supports checklist items 3, 4, and 5.
    wave: 2
    agent: gem-implementer
    prototype: false
    covers: ["3", "4", "5"]
    priority: high
    status: pending
    flags:
      flaky: false
      retries_used: 0
    dependencies: ["TASK-001"]
    conflicts_with: []
    context_files:
      - path: backend/core/brain.py
        description: Session and memory handling currently stores user state by user_id.
      - path: backend/database_supabase.py
        description: Task and memory helpers still accept optional user_id defaults.
      - path: backend/agent/orchestrator.py
        description: Orchestrator task storage and lookup still key off user_id.
    diagnosis:
      root_cause: Shared services still accept optional or default user_id inputs and can be called without a validated principal.
      fix_recommendations: Require explicit principal-scoped parameters, derive tenant filters from request context, and remove fallback defaults for business data access.
      injected_at: "2026-04-21T00:00:00Z"
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: Initial wave-based decomposition from the checklist and PRD.
        timestamp: "2026-04-21T00:00:00Z"
    estimated_effort: medium
    estimated_files: 3
    estimated_lines: 260
    focus_area: tenant-scoping
    verification:
      - "No shared service method uses a default user_id for reads or writes."
      - "Cross-tenant reads are rejected or filtered at the service layer."
      - "Task, memory, and orchestrator helpers accept principal-scoped inputs only."
    acceptance_criteria:
      - "Business data helpers require principal-derived user and tenant scope."
      - "Legacy default user fallbacks are removed from shared service entrypoints."
      - "Storage access is tenant-isolated by construction, not convention."
    failure_modes:
      - scenario: A hidden fallback path still resolves to a default user and leaks data.
        likelihood: medium
        impact: critical
        mitigation: Add tests that search for default user fallbacks, run principal-scoped integration checks, and reject any business read without tenant filters.
    tech_stack: ["FastAPI", "Supabase", "Python 3.11"]
    test_coverage: "service-layer isolation tests, memory/task helper tests, tenant-filter smoke checks"

