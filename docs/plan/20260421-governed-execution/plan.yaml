tldr: |
  Wave 1 establishes the auth boundary, governance persistence, runtime security defaults, and secret cleanup. Wave 2 removes client-controlled user_id flows and introduces the policy/state machine backbone. Wave 3 adds trust metrics, evidence custody, execution controls, and workflow packs. Wave 4 adds the governance UI, Wave 5 hardens CI and validates the end-to-end journeys, and the final waves simplify legacy orchestration paths and publish the docs/ADRs needed for pilot readiness.
open_questions: []
gaps: []
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "Authentication is partially wired, but one route still trusts a client-supplied user_id and leaks tenant data."
      likelihood: medium
      impact: critical
      mitigation: "Gate every business route behind get_current_principal, add denial tests for missing and mismatched principals, and require tenant-scoped helpers in shared storage code."
    - scenario: "Governance migrations or immutable records break existing task/history data during rollout."
      likelihood: medium
      impact: high
      mitigation: "Use additive migrations, backfill scripts, and dual-read compatibility until the new tables and DTOs are proven in staging."
    - scenario: "Approval policy or UI gating becomes too strict and blocks normal institutional workflows."
      likelihood: medium
      impact: high
      mitigation: "Ship the policy engine with explicit defaults, shadow verification, and staged rollout flags before enforcing hard blocks in production."
  assumptions:
    - "FastAPI backend, Supabase storage, and React/Vite frontend remain the core stack."
    - "backend/core/auth.py is the canonical request-principal dependency."
    - "The active frontend shell stays rooted at frontend/src/main.jsx -> frontend/src/App.jsx."
    - "Governance features can be introduced behind feature flags before full rollout."
implementation_specification:
  code_structure: |
    Add a new backend/core/governance package for policy evaluation, state transitions, evidence custody, trust scoring, and execution controls. Keep route modules thin: resolve Principal once, validate role/tenant access, and delegate to governed services. Add a dedicated governance dashboard in the active React app and preserve legacy orchestration surfaces only as compatibility shims until the migration is complete.
  affected_areas:
    - "backend/core/auth.py and backend/main.py for principal resolution and startup enforcement"
    - "backend/database_supabase.py, backend/agent/orchestrator.py, and backend/core/brain.py for tenant-scoped access"
    - "backend/routes/api.py, backend/routes/tasks_v2.py, backend/routes/tasks.py, backend/routes/identity.py, backend/routes/integrations.py, backend/routes/messaging.py"
    - "backend/core/governance/* for policies, approvals, evidence, telemetry, and execution controls"
    - "frontend/src/App.jsx and new governance components for approvals, evidence, and trust metrics"
    - "CI/CD, security scanning, docs, and legacy script consolidation"
  component_details:
    - component: "backend/core/auth.py"
      responsibility: "Resolve authenticated principals and role checks once per request."
      interfaces:
        - "get_current_principal(request, credentials) -> Principal"
        - "require_role(principal, allowed_roles) -> None"
      dependencies: []
      integration_points:
        - "Mounted on every business router via Depends(get_current_principal)"
        - "Supplies request.state.principal or equivalent request context"
    - component: "backend/core/governance/policy_engine.py"
      responsibility: "Classify risk, calculate approval thresholds, and emit policy decisions."
      interfaces:
        - "evaluate_policy(mission) -> PolicyDecision"
        - "get_required_approvers(risk_level, role) -> list"
      dependencies:
        - component: "backend/core/governance/models.py"
          relationship: "Consumes immutable policy and approval record models"
      integration_points:
        - "Mission planning and approval queue generation"
        - "Governance dashboard and evidence exports"
    - component: "backend/core/governance/mission_state_machine.py"
      responsibility: "Enforce locked mission transitions and record audit trail entries."
      interfaces:
        - "transition(mission_id, next_state, actor) -> MissionState"
        - "is_valid_transition(current_state, next_state) -> bool"
      dependencies:
        - component: "backend/core/governance/models.py"
          relationship: "Uses mission status and audit record schemas"
      integration_points:
        - "Task execution engine"
        - "Approval rejection and re-plan flows"
    - component: "backend/core/governance/evidence_vault.py"
      responsibility: "Store artifact hashes, origin metadata, and chain-of-custody records."
      interfaces:
        - "store_artifact(metadata, bytes_or_uri) -> EvidenceRecord"
        - "build_bundle(mission_id) -> EvidenceBundle"
      dependencies:
        - component: "backend/database_supabase.py"
          relationship: "Persists immutable evidence metadata"
      integration_points:
        - "Exportable evidence bundles"
        - "Procurement/pilot proof generation"
    - component: "frontend/src/components/GovernanceDashboard.jsx"
      responsibility: "Render approvals, mission timeline, evidence explorer, and trust metrics."
      interfaces:
        - "GovernanceDashboard({ missionId, trustMetrics, approvals, evidence })"
      dependencies:
        - component: "backend/core/governance/trust_metrics.py"
          relationship: "Consumes trust metric DTOs from the backend"
      integration_points:
        - "Active App.jsx shell"
        - "Task panel and export actions"
