tasks:
  - id: TASK-001
    title: Bind request principal and tenant context
    description: |
      Install the canonical authenticated request context in backend/core/auth.py and backend/main.py.
      Add backend/core/tenant_context.py so downstream code reads a server-resolved principal instead of trusting client-supplied identifiers.
      This is the base security wave for checklist items 1, 2, 4, and 5.
    wave: 1
    agent: gem-implementer
    prototype: false
    covers: ["1", "2", "4", "5"]
    priority: high
    status: pending
    flags:
      flaky: false
      retries_used: 0
    dependencies: []
    conflicts_with: []
    context_files:
      - path: backend/main.py
        description: App startup, middleware registration, and router mounting.
      - path: backend/core/auth.py
        description: Existing principal resolver and role gate helpers.
      - path: backend/config.py
        description: Production setting validation and auth secret checks.
    diagnosis:
      root_cause: Requests are not uniformly bound to an authenticated principal and tenant context.
      fix_recommendations: Resolve the principal once per request, attach it to request state, and fail closed when auth is missing or invalid.
      injected_at: "2026-04-21T00:00:00Z"
    planning_pass: 1
    planning_history:
      - pass: 1
        reason: Initial wave-based decomposition from the checklist and PRD.
        timestamp: "2026-04-21T00:00:00Z"
    estimated_effort: medium
    estimated_files: 3
    estimated_lines: 220
    focus_area: auth-boundary
    verification:
      - "Unauthenticated business requests return 401 outside dev/test modes."
      - "Dev-only bypass requires explicit dev headers and never activates in production."
      - "Request state exposes a normalized principal object for downstream handlers."
    acceptance_criteria:
      - "Every business request resolves a server-authenticated principal before route logic runs."
      - "Tenant and user context are attached once and reused instead of trusting incoming user_id values."
      - "Auth failures are logged without leaking secrets."
    failure_modes:
      - scenario: Dev bypass leaks into production or staging.
        likelihood: medium
        impact: critical
        mitigation: Gate bypass strictly on environment and add startup tests that fail when dev headers are accepted outside dev-like modes.
    tech_stack: ["FastAPI", "Pydantic", "Python 3.11"]
    test_coverage: "auth dependency tests, prod-denial tests, request-context smoke tests"

